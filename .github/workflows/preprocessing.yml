name: Data Preprocessing

on:
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pandas
          pip install numpy
          pip install scikit-learn

      - name: Run Preprocessing Script
        run: |
          python Eksperimen_SML_Telco_Churn/preprocessing/automate_telco_churn.py

      - name: Upload Processed Dataset
        uses: actions/upload-artifact@v4
        with:
          name: telco-preprocessed
          path: Eksperimen_SML_Telco_Churn/preprocessing/telco_preprocessing.csv